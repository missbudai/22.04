<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写文章 & 分享</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'PingFang SC', sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: #1a4a3a;
      color: #fff;
      padding: 16px 18px;
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header span { font-size: 13px; color: rgba(255,255,255,0.6); font-weight: 400; }
    .editor {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #title-input {
      width: 100%;
      font-size: 22px;
      font-weight: 700;
      border: none;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      outline: none;
      color: #1a1a1a;
    }
    #title-input::placeholder { color: #ccc; }
    #body-input {
      width: 100%;
      min-height: 300px;
      font-size: 16px;
      line-height: 1.8;
      border: none;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      outline: none;
      resize: none;
      color: #333;
    }
    #body-input::placeholder { color: #ccc; }
    .actions {
      padding: 0 18px 18px;
    }
    .btn-share {
      width: 100%;
      padding: 15px;
      background: #07c160;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* 阅读模式 */
    #read-view {
      padding: 24px 18px 48px;
    }
    #read-view h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.4;
      margin-bottom: 18px;
    }
    #read-view .body-text {
      font-size: 16px;
      line-height: 1.9;
      color: #333;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* 分享提示弹窗 */
    #share-tip {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    #share-tip.show { display: flex; }
    .share-tip-box {
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 28px 24px 40px;
      width: 100%;
      text-align: center;
    }
    .share-tip-box .tip-icon { font-size: 40px; margin-bottom: 14px; }
    .share-tip-box h3 { font-size: 18px; font-weight: 700; color: #1a1a1a; margin-bottom: 10px; }
    .share-tip-box p { font-size: 14px; color: #888; line-height: 1.7; margin-bottom: 16px; }
    .share-link {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #555;
      word-break: break-all;
      margin-bottom: 18px;
      text-align: left;
    }
    .btn-copy {
      width: 100%;
      padding: 13px;
      background: #1a4a3a;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .share-tip-close {
      background: #f0f0f0;
      border: none;
      border-radius: 999px;
      padding: 12px 36px;
      font-size: 15px;
      color: #333;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 编辑模式 -->
  <div id="edit-mode">
    <header>
      📝 写文章
      <span>填写后生成分享链接</span>
    </header>
    <div class="editor">
      <input id="title-input" type="text" placeholder="文章标题（点击输入）">
      <textarea id="body-input" placeholder="在这里写下你的文章内容……"></textarea>
    </div>
    <div class="actions">
      <button class="btn-share" onclick="generateLink()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
          <path d="M8.7 10.6c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9zm4.6 0c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9zM12 2C6.5 2 2 6.1 2 11.2c0 2.9 1.4 5.5 3.7 7.3l-.8 3.1 3.3-1.7c1 .3 2 .5 3 .5 5.5 0 10-4.1 10-9.2C22 6.1 17.5 2 12 2z"/>
        </svg>
        生成分享链接
      </button>
    </div>
  </div>

  <!-- 阅读模式 -->
  <div id="read-mode" style="display:none;">
    <header>
      📖 阅读
      <span id="read-header-title"></span>
    </header>
    <div id="read-view">
      <h1 id="read-title"></h1>
      <div id="read-body" class="body-text"></div>
    </div>
  </div>

  <!-- 分享提示弹窗 -->
  <div id="share-tip">
    <div class="share-tip-box">
      <div class="tip-icon">🔗</div>
      <h3>分享链接已生成</h3>
      <p>复制下方链接，发送给微信好友，<br>对方打开即可直接阅读文章。</p>
      <div class="share-link" id="share-link-text"></div>
      <button class="btn-copy" onclick="copyLink()">复制链接</button>
      <br>
      <button class="share-tip-close" onclick="closeShareTip()">关闭</button>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const title = params.get('t');
      const body = params.get('b');
      if (title || body) {
        document.getElementById('edit-mode').style.display = 'none';
        document.getElementById('read-mode').style.display = 'block';
        document.getElementById('read-title').textContent = decodeURIComponent(title || '');
        document.getElementById('read-body').textContent = decodeURIComponent(body || '');
        document.getElementById('read-header-title').textContent = decodeURIComponent(title || '');
        document.title = decodeURIComponent(title || '文章');
      }
    })();

    let generatedUrl = '';

    function generateLink() {
      const title = document.getElementById('title-input').value.trim();
      const body = document.getElementById('body-input').value.trim();
      if (!title) {
        alert('请先填写文章标题 😊');
        return;
      }
      const base = window.location.origin + window.location.pathname;
      const url = base + '?t=' + encodeURIComponent(title) + '&b=' + encodeURIComponent(body);
      if (url.length > 8000) {
        alert('文章内容太长，链接可能无法正常打开，请适当缩短内容。');
        return;
      }
      generatedUrl = url;
      document.getElementById('share-link-text').textContent = url;
      document.getElementById('share-tip').classList.add('show');
    }

    function copyLink() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(generatedUrl).then(() => {
          alert('链接已复制，去微信粘贴发送吧！');
        });
      } else {
        const el = document.createElement('textarea');
        el.value = generatedUrl;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        alert('链接已复制，去微信粘贴发送吧！');
      }
    }

    function closeShareTip() {
      document.getElementById('share-tip').classList.remove('show');
    }

    document.getElementById('share-tip').addEventListener('click', function(e) {
      if (e.target === this) closeShareTip();
    });
  </script>
</body>
</html>
